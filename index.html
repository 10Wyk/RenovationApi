<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RDDU Renovation API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; padding: 0; }
    .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    const spec = {
      "openapi": "3.0.3",
      "info": {
        "title": "RDDU Renovation API",
        "version": "1.0.0",
        "description": "API для работы с объектами реновации"
      },
      "servers": [{ "url": "http://localhost:8080/RdduServer", "description": "Local server" }],
      "security": [{ "basicAuth": [] }],
      "paths": {
        "/renovation/object/{id}": {
          "get": {
            "summary": "Получить объект реновации",
            "description": "Возвращает полные данные объекта реновации по его порталовому идентификатору, включая строения, правообладателей и документы.",
            "operationId": "getRenovationObject",
            "tags": ["Renovation"],
            "parameters": [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "description": "Уникальный идентификатор объекта реновации (portalId)",
                "schema": { "type": "integer", "format": "int64" },
                "example": 46
              }
            ],
            "responses": {
              "200": {
                "description": "Объект найден",
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/RenovationContractResponse" },
                    "example": {
                      "id": 59,
                      "number": "05-0008",
                      "date": "27.03.2026",
                      "ownersCount": 1,
                      "auth": {
                        "bin": "191240020942",
                        "name": "ТОО \"Esil Park\"",
                        "email": "ehehehehe@outlook.com",
                        "phone": "+7(747)550-01-68"
                      },
                      "objects": [
                        {
                          "id": 90,
                          "objectCategory": 1,
                          "cadastralNum": "24-432-243-2423",
                          "katoCode": "711510000",
                          "addressName": "г.Астана, район Нұра, улица 1, д. 2",
                          "latitude": " 71.455078",
                          "longitude": "51.124213",
                          "yearBuilt": 2026,
                          "floors": 14,
                          "entranceCount": 12,
                          "totalAreaM": 12.0,
                          "apartmentNum": 12,
                          "uninhabitedNum": 12,
                          "ownersCount": 1,
                          "landAreaHa": 0.0,
                          "images": [
                            "bfa29fe6-5753-4312-b952-d38f4b467b84",
                            "d33327ac-74c1-4174-bcd6-47afa3aac28e",
                            "c3d4ba1c-3cf5-4426-a60d-bf8c6d719d99",
                            "f9feb8c0-50b2-410f-8873-71c823543fea"
                          ],
                          "owners": [
                            {
                              "id": 215,
                              "ownerPersons": [
                                {
                                  "type": 1,
                                  "xin": "010927551059",
                                  "name": "Алтынбеков Бекзат Алтынбекұлы"
                                }
                              ],
                              "roomNumber": "4",
                              "roomType": 1,
                              "entranceNum": "1",
                              "roomCount": 3,
                              "floor": 2,
                              "totalAreaM": 5.0,
                              "livingAreaM": 6.0,
                              "landAreaHa": 0.0,
                              "cadastralNum": "45-234-543-5345",
                              "addressName": "г.Астана, район Алматы, улица 1, д. 2",
                              "obligationFrom": 1,
                              "independentValuationPrice": 0.0,
                              "independentValuationDocName": null,
                              "independentValuationDocJcrId": null,
                              "compensationAmount": 0.0,
                              "landValuationPrice": 0.0,
                              "landValuationDocName": null,
                              "landValuationJcrId": null,
                              "tempHousingStatus": 0,
                              "tempHousingDocName": null,
                              "tempHousingDocJcrId": null,
                              "agreementStatusId": 2,
                              "agreementDocumentName": null,
                              "agreementDocumentJcrId": null,
                              "createdAt": "25.06.2026 10:12:07",
                              "updatedAt": "25.06.2026 10:32:49",
                              "documents": [
                                {
                                  "docName": "TLL_12_135_AT_ДДУ_1_дб.pdf",
                                  "jcrId": "49a28b1a-d349-4d10-9572-f6db0ed3f25d"
                                },
                                {
                                  "docName": "TLL_12_135_AT_ДДУ_Берекетов_Еркин_Тулегенович_1_дб.pdf",
                                  "jcrId": "dfd76048-204b-4c89-9ce5-1214da72d1d4"
                                },
                                {
                                  "docName": "TLL_12_135_AT_ДДУ_Берекетов_Еркин_Тулегенович_4_дб.pdf",
                                  "jcrId": "a3d504a3-5333-4028-ba1d-3cfc37f78df3"
                                }
                              ]
                            }
                          ]
                        }
                      ]
                    }
                  }
                }
              },
              "401": { "description": "Не авторизован — отсутствует или неверный заголовок Authorization" },
              "404": { "description": "Объект с указанным id не найден" }
            }
          }
        }
      },
      "components": {
        "securitySchemes": {
          "basicAuth": { "type": "http", "scheme": "basic" }
        },
        "schemas": {
          "RenovationContractResponse": {
            "type": "object",
            "description": "Договор реновации. Корневой объект ответа.",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64",
                "example": 46,
                "description": "Внутренний идентификатор договора в системе."
              },
              "number": {
                "type": "string",
                "example": "05-0008",
                "description": "Номер договора реновации. Формат: `05-0008`."
              },
              "date": {
                "type": "string",
                "example": "27.03.2026",
                "description": "Дата заключения договора. Формат: `DD.MM.YYYY`."
              },
              "ownersCount": {
                "type": "integer",
                "example": 15,
                "description": "Общее количество cобственников"
              },
              "auth": {
                "$ref": "#/components/schemas/AuthInfo"
              },
              "objects": {
                "type": "array",
                "items": { "$ref": "#/components/schemas/RenovationObject" },
                "description": "Список объектов недвижимости, включённых в договор реновации."
              }
            }
          },

          "AuthInfo": {
            "type": "object",
            "description": "Уполномоченная компания",
            "properties": {
              "bin": {
                "type": "string",
                "example": "191240020942",
                "description": "БИН организации (бизнес-идентификационный номер). 12 цифр."
              },
              "name": {
                "type": "string",
                "example": "ТОО \"Esil Park\"",
                "description": "Полное наименование организации."
              },
              "email": {
                "type": "string",
                "format": "email",
                "description": "Контактный адрес электронной почты организации."
              },
              "phone": {
                "type": "string",
                "example": "+7(747)550-01-68",
                "description": "Контактный номер телефона организации."
              }
            }
          },

          "RenovationObject": {
            "type": "object",
            "description": "Объект недвижимости, включённый в договор реновации.",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64",
                "description": "Внутренний идентификатор объекта в системе."
              },
              "objectCategory": {
                "type": "integer",
                "example": 1,
                "description": "Категория объекта недвижимости:\n\n1 — Многоквартирный жилой дом\n\n2 — Многоквартирный жилой дом (малоэтажное строительство)\n\n3 — Индивидуальный жилой дом\n\n4 — Коммерческий объект\n\n5 — Иной объект"
              },
              "cadastralNum": {
                "type": "string",
                "example": "11-111-111-1111",
                "description": "Кадастровый номер земельного участка или объекта. Формат: `11-111-111-1111`."
              },
              "katoCode": {
                "type": "string",
                "example": "711510000",
                "description": "Код населённого пункта по классификатору КАТО (Казахстан)."
              },
              "addressName": {
                "type": "string",
                "description": "Полный почтовый адрес объекта."
              },
              "latitude": {
                "type": "string",
                "description": "Географическая широта объекта."
              },
              "longitude": {
                "type": "string",
                "description": "Географическая долгота объекта."
              },
              "yearBuilt": {
                "type": "integer",
                "description": "Год постройки здания."
              },
              "floors": {
                "type": "integer",
                "description": "Этажность здания (количество этажей)."
              },
              "entranceCount": {
                "type": "integer",
                "description": "Количество подъездов в здании."
              },
              "totalAreaM": {
                "type": "number",
                "format": "double",
                "description": "Общая площадь здания, кв. м."
              },
              "apartmentNum": {
                "type": "integer",
                "description": "Общее количество квартир (жилых помещений) в здании."
              },
              "uninhabitedNum": {
                "type": "integer",
                "description": "Количество нежилых помещений в здании (офисы, коммерческие площади)."
              },
              "ownersCount": {
                "type": "integer",
                "description": "Количество собственников по данному объекту."
              },
              "landAreaHa": {
                "type": "number",
                "format": "double",
                "description": "Площадь земельного участка под объектом, га."
              },
              "images": {
                "type": "array",
                "items": { "type": "string", "format": "uuid" },
                "description": "Список UUID изображений объекта. Для получения файла используйте эндпоинт загрузки по JCR-идентификатору."
              },
              "owners": {
                "type": "array",
                "items": { "nullable": true, "$ref": "#/components/schemas/OwnerRecord" },
                "description": "Список записей о собственниках (квартирах/помещениях) внутри объекта."
              }
            }
          },

          "OwnerRecord": {
            "type": "object",
            "nullable": true,
            "description": "Запись о правообладателе — содержит данные о конкретном помещении и его владельцах.",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64",
                "description": "Внутренний идентификатор записи о собственника."
              },
              "ownerPersons": {
                "type": "array",
                "items": { "$ref": "#/components/schemas/OwnerPerson" },
                "description": "Список физических или юридических лиц — совладельцев данного помещения."
              },
              "roomNumber": {
                "type": "string",
                "nullable": true,
                "description": "Номер квартиры или помещения."
              },
              "roomType": {
                "type": "integer",
                "description": "Тип помещения (жилое, нежилое и т.д.). Справочник уточняется на стороне системы."
              },
              "entranceNum": {
                "type": "string",
                "nullable": true,
                "description": "Номер подъезда, в котором расположено помещение."
              },
              "roomCount": {
                "type": "integer",
                "description": "Количество комнат в помещении."
              },
              "floor": {
                "type": "integer",
                "description": "Этаж, на котором расположено помещение."
              },
              "totalAreaM": {
                "type": "number",
                "format": "double",
                "description": "Общая площадь помещения, кв. м."
              },
              "livingAreaM": {
                "type": "number",
                "format": "double",
                "description": "Жилая площадь помещения (без учёта кухни, санузла, коридора), кв. м."
              },
              "landAreaHa": {
                "type": "number",
                "format": "double",
                "description": "Площадь земельного участка, относящегося к данному помещению, га. Обычно `0` для квартир."
              },
              "cadastralNum": {
                "type": "string",
                "nullable": true,
                "description": "Кадастровый номер помещения."
              },
              "addressName": {
                "type": "string",
                "nullable": true,
                "description": "Адрес помещения"
              },
              "obligationFrom": {
                "type": "integer",
                "description": "Форма исполнения обязательства перед правообладателем:\n\n1 — Предоставление денежной компенсации\n\n2 — Выделение доли"
              },
              "independentValuationPrice": {
                "type": "number",
                "format": "double",
                "description": "Стоимость помещения по независимой оценке, тенге."
              },
              "independentValuationDocName": {
                "type": "string",
                "nullable": true,
                "description": "Название файла документа о независимой оценке."
              },
              "independentValuationDocJcrId": {
                "type": "string",
                "format": "uuid",
                "nullable": true,
                "description": "UUID файла документа о независимой оценке в хранилище JCR."
              },
              "compensationAmount": {
                "type": "number",
                "format": "double",
                "description": "Сумма денежной компенсации, тенге."
              },
              "landValuationPrice": {
                "type": "number",
                "format": "double",
                "description": "Стоимость земельного участка по независимой оценке, тенге."
              },
              "landValuationDocName": {
                "type": "string",
                "nullable": true,
                "description": "Название файла документа по независимой оценке земельного участка."
              },
              "landValuationJcrId": {
                "type": "string",
                "format": "uuid",
                "nullable": true,
                "description": "UUID файла документа по независимой оценке земли в хранилище JCR."
              },
              "tempHousingStatus": {
                "type": "integer",
                "description": "Статус предоставления временного жилья:\n\n1 — Предоставлено\n\n2 — Не предоставлено"
              },
              "tempHousingDocName": {
                "type": "string",
                "nullable": true,
                "description": "Название файла документа о предоставлении временного жилья."
              },
              "tempHousingDocJcrId": {
                "type": "string",
                "format": "uuid",
                "nullable": true,
                "description": "UUID файла документа о временном жилье в хранилище JCR."
              },
              "agreementStatusId": {
                "type": "integer",
                "description": "Идентификатор статуса заключения соглашения в рамках реализации проекта реновации:\n\n1 — Зарегистрировано\n\n2 — Не зарегистрировано"
              },
              "agreementDocumentName": {
                "type": "string",
                "nullable": true,
                "description": "Название файла документа соглашения в рамках реализации проекта реновации."
              },
              "agreementDocumentJcrId": {
                "type": "string",
                "format": "uuid",
                "nullable": true,
                "description": "UUID файла документа о согласии в хранилище JCR."
              },
              "createdAt": {
                "type": "string",
                "example": "24.06.2026 03:49:46",
                "description": "Дата и время создания записи. Формат: `DD.MM.YYYY HH:mm:ss`."
              },
              "updatedAt": {
                "type": "string",
                "example": "24.06.2026 03:49:46",
                "description": "Дата и время последнего обновления записи. Формат: `DD.MM.YYYY HH:mm:ss`."
              },
              "documents": {
                "type": "array",
                "items": { "$ref": "#/components/schemas/DocumentRef" },
                "description": "Документы, подтверждающие денежную компенсацию."
              }
            }
          },

          "OwnerPerson": {
            "type": "object",
            "description": "Физическое или юридическое лицо — правообладатель помещения.",
            "properties": {
              "type": {
                "type": "integer",
                "description": "Тип субъекта-правообладателя:\n\n1 — Физическое лицо\n\n2 — Юридическое лицо"
              },
              "xin": {
                "type": "string",
                "description": "ИИН (для физических лиц) или БИН (для юридических лиц). 12 цифр."
              },
              "name": {
                "type": "string",
                "description": "Полное ФИО физического лица или наименование организации."
              }
            }
          },

          "DocumentRef": {
            "type": "object",
            "description": "Ссылка на документ в хранилище JCR.",
            "properties": {
              "docName": {
                "type": "string",
                "example": "Разрешение (1).pdf",
                "description": "Отображаемое имя файла документа."
              },
              "jcrId": {
                "type": "string",
                "format": "uuid",
                "description": "UUID документа в хранилище JCR. Используется для скачивания файла через соответствующий эндпоинт."
              }
            }
          }
        }
      }
    };

    SwaggerUIBundle({
      spec,
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: "BaseLayout",
      deepLinking: true
    });
  </script>
</body>
</html>
